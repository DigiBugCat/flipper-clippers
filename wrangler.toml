name = "flipper-clippers"
main = "src/index.ts"
compatibility_date = "2024-12-01"

# Custom domain
routes = [
  { pattern = "flipper-clippers.arross.tv", custom_domain = true }
]

# Static assets from public folder
[assets]
directory = "public"

# D1 Database
[[d1_databases]]
binding = "DB"
database_name = "clip-ranker-db"
database_id = "7154d07b-e848-402a-a4e7-df008883bad4"

# KV Namespace for thumbnail cache
[[kv_namespaces]]
binding = "THUMBNAIL_CACHE"
id = "c89c6fa414414250bbe533027b37aac4"
preview_id = "c3ee3947410547259cba928e8215cddc"

[[kv_namespaces]]
binding = "SESSION_CACHE"
id = "69e141f39cec4084b33dda454fc4903f"
preview_id = "d19ee8cbb9b14ff9abceb5c55476f04c"

[vars]
TWITCH_CLIENT_ID = "bcsrqxz7j1ivepc5g2bfnreok2x2g0"

# Scheduled triggers for daily clip sync
[triggers]
crons = ["0 0 * * *"]  # Daily at midnight UTC

# Smart Placement: Run worker closer to D1 database (WNAM region)
[placement]
mode = "smart"

# Analytics Engine for vote audit log (replaces D1 comparisons writes)
[[analytics_engine_datasets]]
binding = "VOTES_ANALYTICS"
dataset = "clip_votes"

# Durable Objects for aggregation coordination
[durable_objects]
bindings = [
  { name = "AGGREGATION_COORDINATOR", class_name = "AggregationCoordinator" }
]

[[migrations]]
tag = "v1"
new_classes = ["AggregationCoordinator"]

# Queues for async vote processing
[[queues.producers]]
binding = "VOTE_QUEUE"
queue = "flipper-votes"

[[queues.consumers]]
queue = "flipper-votes"
max_batch_size = 100
max_batch_timeout = 5
max_retries = 3

