name = "clipdle"
main = "src/clipdle.ts"
compatibility_date = "2024-12-01"

# Custom domain for Clipdle
routes = [
  { pattern = "clipdle.arross.tv", custom_domain = true }
]

# Static assets from public-clipdle folder
[assets]
directory = "public-clipdle"

# D1 Database (shared with main worker, read-only access)
[[d1_databases]]
