<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Compare Clips - Clip Ranker</title>
  <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body>
  <nav class="navbar">
    <a href="/" class="nav-brand">Clip Ranker</a>
    <div class="nav-links">
      <a href="/compare" class="nav-link active">Compare</a>
      <a href="/leaderboard" class="nav-link">Leaderboard</a>
    </div>
    <div class="nav-user" id="nav-user">
    </div>
  </nav>

  <div class="container">
    <!-- Auth required message (hidden when logged in) -->
    <div id="auth-required" class="hero" style="display: none;">
      <h2>Sign in to Start Ranking</h2>
      <p>You need to sign in with Twitch to compare and rank clips.</p>
      <a href="/api/auth/login" class="btn btn-twitch" style="margin-top: 1rem;">
        Sign in with Twitch
      </a>
    </div>

    <!-- Main comparison UI (hidden until logged in) -->
    <div id="compare-ui" style="display: none;">
      <!-- Progress bar -->
      <div class="progress-bar">
        <div class="progress-stats">
          <div class="progress-stat">
            <div class="progress-stat-value" id="user-comparisons">0</div>
            <div class="progress-stat-label">Your Comparisons</div>
          </div>
          <div class="progress-stat">
            <div class="progress-stat-value" id="user-super-likes">0</div>
            <div class="progress-stat-label">Super Likes</div>
          </div>
          <div class="progress-stat">
            <div class="progress-stat-value" id="coverage-percent">0%</div>
            <div class="progress-stat-label">Coverage</div>
          </div>
        </div>
      </div>

      <!-- Video comparison -->
      <div class="comparison-container" id="comparison-container">
        <div class="video-panel" id="panel-a">
          <div class="video-wrapper" id="video-wrapper-a">
            <!-- Twitch embed loaded here -->
          </div>
          <div class="video-info">
            <div class="video-title" id="title-a">Loading...</div>
          </div>
        </div>

        <div class="video-panel" id="panel-b">
          <div class="video-wrapper" id="video-wrapper-b">
            <!-- Twitch embed loaded here -->
          </div>
          <div class="video-info">
            <div class="video-title" id="title-b">Loading...</div>
          </div>
        </div>
      </div>

      <!-- Loading state -->
      <div class="loading" id="loading-state" style="display: none;">
        <div class="spinner"></div>
      </div>

      <!-- Action buttons -->
      <div class="action-buttons" id="action-buttons">
        <button class="btn btn-vote btn-super" onclick="vote('super_a')" title="Super Like Left (Shift+1)">
          ⭐ Super Like Left
        </button>
        <button class="btn btn-vote btn-left" onclick="vote('clip_a')" title="Left is Better (1)">
          👈 Left Better
        </button>
        <button class="btn btn-vote btn-tie" onclick="vote('tie')" title="Tie (T)">
          🤝 Tie
        </button>
        <button class="btn btn-vote btn-right" onclick="vote('clip_b')" title="Right is Better (2)">
          Right Better 👉
        </button>
        <button class="btn btn-vote btn-super" onclick="vote('super_b')" title="Super Like Right (Shift+2)">
          Super Like Right ⭐
        </button>
      </div>

      <div class="action-buttons">
        <button class="btn btn-vote btn-skip" onclick="vote('skip')" title="Skip (S)">
          Skip
        </button>
      </div>

      <!-- Keyboard shortcuts hint -->
      <div class="shortcuts-hint">
        <span class="shortcut-key">1</span> Left
        <span class="shortcut-key">2</span> Right
        <span class="shortcut-key">Shift+1</span> Super Left
        <span class="shortcut-key">Shift+2</span> Super Right
        <span class="shortcut-key">T</span> Tie
        <span class="shortcut-key">S</span> Skip
      </div>
    </div>
  </div>

  <!-- Toast notification -->
  <div class="toast" id="toast"></div>

  <script src="/static/js/app.js"></script>
  <script src="/static/js/compare.js"></script>
</body>
</html>
